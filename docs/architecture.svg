<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
<title id="title">AI Front Desk — architecture overview</title>
<desc id="desc">Implemented architecture, verified on the hosted demo in October 2026. Parent and operator views use a Next.js server on Vercel. The server reads and writes policies, conversations and requests in Neon PostgreSQL and calls the configured OpenAI model. Response and source validation leads to a cited answer, clarification, or an offer to ask staff. Staff replies stay in the conversation; reusable knowledge requires explicit review and publication.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#859396"/></marker>
 <marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#27877b"/></marker>
 <style>
 text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#243a3e;text-anchor:middle}
 .head{font-size:22px;font-weight:650}.sub{font-size:17px;fill:#53686c}.label{font-size:15px;fill:#53686c}
 .line{fill:none;stroke:#859396;stroke-width:2;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}
 .loop{fill:none;stroke:#27877b;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#teal)}
 </style>
</defs>
<rect width="1120" height="850" fill="#fff"/>
<text x="48" y="57" style="text-anchor:start;font-size:32px;font-weight:700">AI Front Desk</text>
<text x="48" y="89" class="sub" style="text-anchor:start">Grounded answers → staff follow-up → better knowledge</text>
<text x="1072" y="57" class="label" style="text-anchor:end;letter-spacing:1px">VERIFIED PROTOTYPE · OCT 2026</text>

<!-- Parent and operator use the same application server. -->
<rect x="48" y="142" width="270" height="88" rx="12" fill="#f5f4f0" stroke="#c8cac4"/>
<text x="183" y="179" class="head">Parent view</text>
<text x="183" y="207" class="sub">Ask · read answers · follow up</text>
<rect x="414" y="142" width="292" height="88" rx="12" fill="#eeedff" stroke="#b5b0ec"/>
<text x="560" y="179" class="head">Next.js server</text>
<text x="560" y="207" class="sub">Vercel · server-side model + DB</text>
<rect x="802" y="142" width="270" height="88" rx="12" fill="#f5f4f0" stroke="#c8cac4"/>
<text x="937" y="179" class="head">Operator view</text>
<text x="937" y="207" class="sub">Reply · manage knowledge</text>
<path d="M328 186H404" class="line both"/>
<path d="M792 186H716" class="line both"/>

<!-- Database access remains on the server; publishing is explicit. -->
<rect x="802" y="341" width="270" height="105" rx="12" fill="#e4f5ef" stroke="#8ac5b8"/>
<text x="937" y="376" class="head">Neon PostgreSQL</text>
<text x="937" y="404" class="sub">Published policies · drafts</text>
<text x="937" y="429" class="sub">Conversations · requests · usage</text>
<path d="M716 208H755V393H792" class="line both"/>
<text x="756" y="474" class="label">Server reads / writes</text>
<path d="M937 240V331" class="loop"/>
<text x="957" y="278" class="label" style="fill:#237e72;text-anchor:start">Review &amp; publish</text>
<text x="957" y="301" class="label" style="text-anchor:start">through the server</text>

<!-- Logical answer flow, orchestrated by the server. -->
<path d="M560 240V331" class="line"/>
<text x="540" y="278" class="label" style="text-anchor:end">Question + published policies</text>
<rect x="414" y="341" width="292" height="88" rx="12" fill="#eeedff" stroke="#b5b0ec"/>
<text x="560" y="378" class="head">OpenAI model</text>
<text x="560" y="406" class="sub">Structured response + source IDs</text>
<path d="M560 439V500" class="line"/>
<rect x="414" y="510" width="292" height="88" rx="12" fill="#fff2dd" stroke="#d8b579"/>
<text x="560" y="547" class="head" style="font-size:20px">Validate response + sources</text>
<text x="560" y="575" class="sub">Server checks before display</text>

<path d="M464 608V639H183V670" class="line"/>
<path d="M560 608V670" class="line"/>
<path d="M656 608V639H937V670" class="line"/>
<rect x="48" y="680" width="270" height="88" rx="12" fill="#e4f5ef" stroke="#8ac5b8"/>
<text x="183" y="717" class="head">Cited answer</text>
<text x="183" y="745" class="sub">Tap to read the policy</text>
<rect x="425" y="680" width="270" height="88" rx="12" fill="#f5f4f0" stroke="#c8cac4"/>
<text x="560" y="717" class="head">Clarification</text>
<text x="560" y="745" class="sub">Ask for missing details</text>
<rect x="802" y="680" width="270" height="88" rx="12" fill="#fff2dd" stroke="#d8b579"/>
<text x="937" y="717" class="head">Ask staff</text>
<text x="937" y="745" class="sub">Handoff or sensitive request</text>

<path d="M1080 724H1101V186H1082" class="line" stroke-dasharray="5 5"/>
<text x="1090" y="550" class="label" transform="rotate(-90 1090 550)">Staff follow-up</text>
<text x="560" y="815" class="sub">Staff replies stay in the conversation. Only explicit publication improves future AI answers.</text>
</svg>
